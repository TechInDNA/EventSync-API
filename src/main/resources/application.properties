spring.config.import=optional:file:.env[.properties]

spring.application.name=EventSync-API
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://${PGHOST}:5432/${PGDATABASE}?sslmode=${PGSSLMODE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=eventsync_app
spring.jpa.properties.hibernate.format_sql=true

security.jwt.token.secret-key=${JWT_SECRET}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.ai.mcp.server.name=eventsync-api
spring.ai.mcp.server.version=1.0.0

spring.ai.openai.base-url=https://opencode.ai/zen/v1
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.chat.model=${AI_MODEL}


