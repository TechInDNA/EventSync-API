          description: HTTP status code
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: Field affected by the error
              message:
                type: string
                description: Error description for this field

    User:
